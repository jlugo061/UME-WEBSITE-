name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  links:
    name: Broken links and images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir ${{ github.workspace }}/site 'site/**/*.html'
          fail: true
  lighthouse:
    name: Speed, accessibility and SEO (Lighthouse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.github/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
